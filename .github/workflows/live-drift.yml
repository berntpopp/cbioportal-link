name: Live upstream drift alarm

# Weekly live check of the cBioPortal contract this server depends on (the panel-aware count
# endpoints, the acceptance answers, and that alteration-counts/fetch is still gone in the Go
# rewrite). A handful of sequential, filtered calls; never on PRs.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.8.7"
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Live integration tests
        env:
          CBIOPORTAL_LINK_LIVE_INTEGRATION: "1"
        run: make test-integration
